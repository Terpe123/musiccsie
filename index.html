<!doctype html>
<html lang="zh-Hant" style="background-color: #0b0d1b; color: #ffffff; min-height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小小指揮家 Maestro Lite</title>
    <meta name="description" content="經典古典名曲節奏指揮遊戲，跟著音符節奏與方向揮動指揮棒，帶領交響樂團演奏歡樂頌、弦樂小夜曲、卡農等名曲！" />
    <meta property="og:title" content="小小指揮家 Maestro Lite" />
    <meta property="og:description" content="經典古典名曲節奏指揮遊戲，跟著音符節奏與方向揮動指揮棒，帶領交響樂團演奏歡樂頌、弦樂小夜曲、卡農等名曲！" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>

    <style>
      html, body {
        background-color: #0b0d1b !important;
        color: #ffffff !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      }
      #root-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        background: radial-gradient(circle at 50% 15%, #1d2047 0%, #0b0d1b 70%);
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(251, 191, 36, 0.2);
        border-top-color: #fbbf24;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Async non-blocking font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- 載入真實樂器音訊庫 Tone.js -->
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  </head>
  <body class="bg-[#0b0d1b] text-white select-none overflow-x-hidden antialiased">
    <div id="root">
      <div id="root-fallback">
        <div class="spinner"></div>
        <div style="font-size: 24px; font-weight: bold; color: #fbbf24; margin-bottom: 8px;">🎼 小小指揮家</div>
        <div style="font-size: 14px; color: #94a3b8;">樂團準備中，即將登場…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
